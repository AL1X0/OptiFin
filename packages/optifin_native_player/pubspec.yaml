name: optifin_native_player
description: "Lecteurs natifs d’OptiFin : AVPlayer (iOS) et Media3 (Android)."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: app.optifin.optifin_native_player
        pluginClass: OptifinNativePlayerPlugin
      ios:
        pluginClass: OptifinNativePlayerPlugin
