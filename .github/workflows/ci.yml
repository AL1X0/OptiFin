name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5
  # Identifiant fixe : l'IPA/APK de chaque version remplace la précédente et
  # peut être re-signée indéfiniment avec le même profil. NE PAS MODIFIER.
  BUNDLE_ID: app.optifin.optifin

jobs:
  test:
    name: Analyse & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Bundle ID inchangé
        run: |
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" ios/Runner.xcodeproj/project.pbxproj
          ! grep "PRODUCT_BUNDLE_IDENTIFIER = " ios/Runner.xcodeproj/project.pbxproj | grep -v "= $BUNDLE_ID;" | grep -v "= $BUNDLE_ID.RunnerTests;"
          grep -q "applicationId = \"$BUNDLE_ID\"" android/app/build.gradle.kts
      - name: Code généré à jour
        run: |
          dart run build_runner build -d
          git diff --exit-code -- lib
      - run: flutter analyze
      - run: flutter test --reporter expanded

  android:
    name: APK Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Version 1.0.<n° d'exécution CI> : chaque build est vue comme une mise à jour
      # (SideStore ne compare que la version affichée, pas le numéro de build).
      - run: flutter build apk --release --split-per-abi --build-name="$(./.github/scripts/build_name.sh)" --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: optifin-android
          path: build/app/outputs/flutter-apk/*.apk

  ios:
    name: IPA iOS (non signée)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build ios --release --no-codesign --build-name="$(./.github/scripts/build_name.sh)" --build-number=${{ github.run_number }}
        env:
          # Téléchargements : aucune permission Photos ni notifications demandée par background_downloader.
          BYPASS_PERMISSION_IOSADDTOPHOTOLIBRARY: '1'
          BYPASS_PERMISSION_IOSCHANGEPHOTOLIBRARY: '1'
          BYPASS_PERMISSION_NOTIFICATIONS: '1'
      - name: Vérifier le bundle ID de l'app construite
        run: |
          id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" build/ios/iphoneos/Runner.app/Info.plist)
          echo "Bundle ID : $id"
          test "$id" = "$BUNDLE_ID"
          v=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/ios/iphoneos/Runner.app/Info.plist)
          echo "Version : $v"
          test "$v" = "$(./.github/scripts/build_name.sh)"
      # IPA non signée : à signer avec son propre compte (Sideloadly, AltStore…)
      # ou remplacer par une étape de signature quand les secrets Apple seront fournis.
      - name: Empaqueter l'IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qry OptiFin-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: optifin-ios-unsigned
          path: build/ipa/OptiFin-unsigned.ipa

  # Appli Windows native (C# / WinUI 3, NativeAOT) : tests, compilation, installateur.
  windows:
    name: Windows (natif)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: windows-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # libmpv (rendu gpu-next, HDR) est téléchargée et vérifiée par SHA-256 à la compilation.
      - name: Tests
        run: dotnet test --project tests/OptiFin.Core.Tests -c Release
      - name: Compiler (NativeAOT)
        run: |
          VERSION=$(cd .. && ./.github/scripts/build_name.sh)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          dotnet publish src/OptiFin.App/OptiFin.App.csproj -c Release -r win-x64 -p:Platform=x64 -p:Version="$VERSION" -o out/x64
      - name: Installateur (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" //Q //DAppVersion="$VERSION" installer/optifin.iss
          ls -la out/installer
      - uses: actions/upload-artifact@v4
        with:
          name: optifin-windows
          path: windows-native/out/installer/OptiFin-windows-setup.exe

  # Publication SideStore : une Release par build de main, avec l'IPA et la source.
  # Source à ajouter dans SideStore :
  #   https://raw.githubusercontent.com/AL1X0/OptiFin/sidestore/source.json
  # (l'ancienne adresse releases/latest/download/source.json reste valide)
  release:
    name: Publication SideStore
    needs: [ios, android, windows]
    # Les versions téléphone sont publiées même si l'installateur Windows a échoué.
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.ios.result == 'success' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: optifin-ios-unsigned
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: optifin-android
          path: dist/apk
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: optifin-windows
          path: dist
      - name: Préparer l'IPA et la source
        run: |
          mv dist/OptiFin-unsigned.ipa dist/OptiFin.ipa
          # APK : une par architecture ; arm64 (tous les téléphones récents) mise en avant.
          for f in dist/apk/*.apk; do
            abi=$(basename "$f" | sed -E 's/app-(.*)-release\.apk/\1/')
            mv "$f" "dist/OptiFin-android-${abi}.apk"
          done
          ls -la dist
          # Doit être identique à la version inscrite dans l'IPA (SideStore le vérifie).
          VERSION=$(./.github/scripts/build_name.sh)
          BUILD=${{ github.run_number }}
          TAG="build-${BUILD}"
          NOTES=$(git log -1 --pretty=%s)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          node .github/scripts/sidestore_source.mjs dist/OptiFin.ipa "$VERSION" "$BUILD" "$TAG" "$NOTES" > dist/source.json
          # Échoue si le JSON est invalide (SideStore le refuserait).
          node -e "JSON.parse(require('fs').readFileSync('dist/source.json','utf8'))" && cat dist/source.json
      # Brouillon d'abord : la Release ne devient « latest » qu'une fois l'IPA et la source
      # entièrement envoyées (sinon l'URL renverrait brièvement « Not Found »).
      - name: Créer la Release
        run: |
          # Installateur Windows : mise à jour automatique de l'appli PC (si la build a réussi).
          WINDOWS=$(ls dist/OptiFin-windows-setup.exe 2>/dev/null || true)
          gh release create "$TAG" dist/OptiFin.ipa dist/OptiFin-android-*.apk $WINDOWS dist/source.json --draft --target "$GITHUB_SHA" --title "OptiFin $VERSION" --notes "$(git log -1 --pretty=%B)"
          gh release edit "$TAG" --draft=false --latest
      # Source servie directement (sans redirection ni lien signé qui expire) :
      #   https://raw.githubusercontent.com/AL1X0/OptiFin/sidestore/source.json
      - name: Publier la source sur la branche sidestore
        run: |
          mkdir pub && cp dist/source.json pub/ && cd pub
          git init -q -b sidestore
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json && git commit -q -m "Source SideStore $VERSION"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" sidestore
      - name: Ne garder que les 10 dernières builds
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^build-' | sort -t- -k2 -n -r | tail -n +11 |             xargs -r -I{} gh release delete {} --yes --cleanup-tag
