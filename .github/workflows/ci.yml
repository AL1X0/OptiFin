name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5
  # Identifiant fixe : l'IPA/APK de chaque version remplace la précédente et
  # peut être re-signée indéfiniment avec le même profil. NE PAS MODIFIER.
  BUNDLE_ID: app.optifin.optifin

jobs:
  test:
    name: Analyse & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Bundle ID inchangé
        run: |
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" ios/Runner.xcodeproj/project.pbxproj
          ! grep "PRODUCT_BUNDLE_IDENTIFIER = " ios/Runner.xcodeproj/project.pbxproj | grep -v "= $BUNDLE_ID;" | grep -v "= $BUNDLE_ID.RunnerTests;"
          grep -q "applicationId = \"$BUNDLE_ID\"" android/app/build.gradle.kts
      - name: Code généré à jour
        run: |
          dart run build_runner build -d
          git diff --exit-code -- lib
      - run: flutter analyze
      - run: flutter test --reporter expanded

  android:
    name: APK Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Numéro de build = numéro d'exécution CI : chaque version est vue comme une mise à jour.
      - run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: optifin-android
          path: build/app/outputs/flutter-apk/*.apk

  ios:
    name: IPA iOS (non signée)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - name: Vérifier le bundle ID de l'app construite
        run: |
          id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" build/ios/iphoneos/Runner.app/Info.plist)
          echo "Bundle ID : $id"
          test "$id" = "$BUNDLE_ID"
      # IPA non signée : à signer avec son propre compte (Sideloadly, AltStore…)
      # ou remplacer par une étape de signature quand les secrets Apple seront fournis.
      - name: Empaqueter l'IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qry OptiFin-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: optifin-ios-unsigned
          path: build/ipa/OptiFin-unsigned.ipa

  # Publication SideStore : une Release par build de main, avec l'IPA et la source.
  # Source à ajouter dans SideStore :
  #   https://github.com/AL1X0/OptiFin/releases/latest/download/source.json
  release:
    name: Publication SideStore
    needs: ios
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: optifin-ios-unsigned
          path: dist
      - name: Préparer l'IPA et la source
        run: |
          mv dist/OptiFin-unsigned.ipa dist/OptiFin.ipa
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          BUILD=${{ github.run_number }}
          TAG="build-${BUILD}"
          NOTES=$(git log -1 --pretty=%s)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          node .github/scripts/sidestore_source.mjs dist/OptiFin.ipa "$VERSION" "$BUILD" "$TAG" "$NOTES" > dist/source.json
          # Échoue si le JSON est invalide (SideStore le refuserait).
          node -e "JSON.parse(require('fs').readFileSync('dist/source.json','utf8'))" && cat dist/source.json
      - name: Créer la Release
        run: |
          gh release create "$TAG" dist/OptiFin.ipa dist/source.json             --title "OptiFin $VERSION (build ${{ github.run_number }})"             --notes "$(git log -1 --pretty=%B)"             --latest
      - name: Ne garder que les 10 dernières builds
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^build-' | sort -t- -k2 -n -r | tail -n +11 |             xargs -r -I{} gh release delete {} --yes --cleanup-tag
